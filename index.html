<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Elo rating 折線圖</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; margin:20px; }
  h1 { margin: 0 0 12px 0; font-size: 34px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin: 8px 0; }
  #chart { border:1px solid #ddd; border-radius:12px; padding:10px; position:relative; overflow:hidden; }
  #tooltip{
    position:absolute; background:white; border:1px solid #ccc; padding:8px 10px;
    border-radius:10px; font-size:12px; pointer-events:none; opacity:0;
    box-shadow:0 6px 18px rgba(0,0,0,0.08);
    white-space:nowrap;
  }
  input[type="text"]{ padding:6px 10px; border:1px solid #ccc; border-radius:8px; font-size:14px; width:180px; }
  button{ padding:7px 12px; border:1px solid #ccc; border-radius:8px; background:#fff; cursor:pointer; }
  button:hover{ background:#f3f3f3; }
  .panel{ border:1px solid #e6e6e6; background:#fafafa; border-radius:12px; padding:12px; }
  .muted{ color:#666; font-size:13px; }
  .chips{ margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    background:#fff; border:1px solid #ddd; border-radius:999px;
    padding:6px 10px; font-size:13px; display:inline-flex; gap:8px; align-items:center;
  }
  .chip small{ color:#666; }
  .chip button{
    border:none; background:transparent; padding:0; font-size:16px; line-height:1; color:#666;
  }
  textarea{
    width:min(900px, 100%); height:140px; padding:10px;
    border:1px solid #ddd; border-radius:10px; font-size:13px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    background:#fff;
  }
</style>
</head>

<body>
<h1>Elo rating 折線圖</h1>

<div class="panel">
  <div class="row">
    <input id="playerInput" placeholder="輸入選手編號" />
    <button id="addBtn" type="button">加入折線</button>
    <span class="muted">CSV：<code>whr_output_wide.csv</code>（值為 0 會自動忽略）</span>
  </div>

  <div class="muted" style="margin-top:8px">目前顯示（可移除）：</div>
  <div id="playerChips" class="chips"></div>

  <hr style="border:none;border-top:1px solid #e6e6e6;margin:12px 0;">

  <div class="row" style="justify-content:space-between">
    <div>
      <div><b>名錄（可編輯）</b> <span class="muted">每行：選手編號 + TAB/空白 + 名稱</span></div>
      <div class="muted">例：<code>11348&lt;tab&gt;手塚</code></div>
    </div>
    <button id="applyRosterBtn" type="button">套用名錄</button>
  </div>

  <textarea id="rosterText" spellcheck="false" placeholder="把你的 名錄.txt 貼在這裡（例如：&#10;11348	手塚&#10;603	金田&#10;178	Shaman&#10;...）"></textarea>
</div>

<div id="chart" style="margin-top:12px">
  <div id="tooltip"></div>
</div>

<script>
/** 預設選手：你原本那批「曾為 Elo 最高」的名單 */
const defaultPlayers = [
  "178","299","300","488","578","603","698","700",
  "3024","4011","4014","4043","4097","5537",
  "5568","5577","10027","10104","10851",
  "11348","13168"
];

let selectedPlayers = new Set(defaultPlayers);
let rosterMap = new Map();         // id -> name
let rawData = null;

const width = 1200;
const height = 560;
const margin = {top:20,right:20,bottom:40,left:70};

const svg = d3.select("#chart").append("svg")
  .attr("viewBox", `0 0 ${width} ${height}`);

const plot = svg.append("g")
  .attr("transform", `translate(${margin.left},${margin.top})`);

const innerW = width - margin.left - margin.right;
const innerH = height - margin.top - margin.bottom;

const xScale = d3.scaleTime().range([0, innerW]);
const yScale = d3.scaleLinear().range([innerH, 0]);
const color = d3.scaleOrdinal(d3.schemeTableau10);

const tooltip = d3.select("#tooltip");

function parseRoster(text){
  const m = new Map();
  const lines = text.split(/\r?\n/);
  for (const line of lines){
    const s = line.trim();
    if (!s) continue;
    // 支援 tab 或多空白分隔： "11348\t手塚" 或 "11348 手塚"
    const parts = s.split(/\s+/);
    if (parts.length < 2) continue;
    const id = parts[0];
    const name = parts.slice(1).join(" ");
    m.set(id, name);
  }
  return m;
}

function displayLabel(id){
  const name = rosterMap.get(id);
  return name ? `${id} (${name})` : id;
}

function renderChips(){
  const wrap = document.getElementById("playerChips");
  wrap.innerHTML = "";
  [...selectedPlayers].sort((a,b)=>Number(a)-Number(b)).forEach(id=>{
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.innerHTML = `<span>${displayLabel(id)}</span>`;
    const x = document.createElement("button");
    x.textContent = "×";
    x.title = "移除";
    x.onclick = () => {
      selectedPlayers.delete(id);
      draw();
      renderChips();
    };
    chip.appendChild(x);
    wrap.appendChild(chip);
  });
}

function buildSeries(playerId){
  // 重要：不要 filter 掉缺值，保留點，交給 line.defined 斷線
  return rawData.map(d => {
    const v = d[playerId];
    return { date: d.date, value: (v == null || Number.isNaN(v)) ? null : v };
  });
}

function nearestDefinedPoint(series, targetDate){
  // 找距離 targetDate 最近、且 value != null 的點
  const bisect = d3.bisector(d=>d.date).left;
  let i = bisect(series, targetDate, 1);
  let left = i-1, right = i;
  let best = null, bestDist = Infinity;

  while (left >= 0 || right < series.length){
    if (left >= 0){
      const d = series[left];
      if (d.value != null){
        const dist = Math.abs(targetDate - d.date);
        if (dist < bestDist){ best = d; bestDist = dist; }
        break; // 左側最近已找到
      }
      left--;
    }
    if (right < series.length){
      const d = series[right];
      if (d.value != null){
        const dist = Math.abs(d.date - targetDate);
        if (dist < bestDist){ best = d; bestDist = dist; }
        break; // 右側最近已找到
      }
      right++;
    }
  }
  return best;
}

function draw(){
  if (!rawData) return;

  plot.selectAll("*").remove();

  const players = [...selectedPlayers];
  color.domain(players);

  // collect extents (ignore null)
  const points = [];
  for (const p of players){
    for (const d of rawData){
      const v = d[p];
      if (v != null && !Number.isNaN(v)) points.push({date:d.date, value:v});
    }
  }
  if (!points.length) return;

  xScale.domain(d3.extent(points, d=>d.date));
  yScale.domain(d3.extent(points, d=>d.value)).nice();

  plot.append("g")
    .attr("transform", `translate(0,${innerH})`)
    .call(d3.axisBottom(xScale).ticks(10));

  plot.append("g")
    .call(d3.axisLeft(yScale));

  const line = d3.line()
    .defined(d => d.value != null) // <<== 缺值斷線（0 已轉 null）
    .x(d => xScale(d.date))
    .y(d => yScale(d.value));

  // 畫每條線 + hover hit area
  for (const p of players){
    const series = buildSeries(p);

    plot.append("path")
      .datum(series)
      .attr("fill","none")
      .attr("stroke", color(p))
      .attr("stroke-width", 1.8)
      .attr("d", line);

    plot.append("path")
      .datum(series)
      .attr("fill","none")
      .attr("stroke","transparent")
      .attr("stroke-width", 10)
      .attr("d", line)
      .style("cursor","crosshair")
      .on("mousemove", (event) => {
        const [mx] = d3.pointer(event, plot.node());
        const date = xScale.invert(mx);

        const pt = nearestDefinedPoint(series, date);
        if (!pt) return;

        const name = rosterMap.get(p);
        tooltip.style("opacity", 1)
          .html(`
            <div><b>選手</b>：${name ? `${p} (${name})` : p}</div>
            <div><b>日期</b>：${d3.timeFormat("%Y-%m-%d")(pt.date)}</div>
            <div><b>Elo</b>：${pt.value.toFixed(3)}</div>
          `)
          .style("left", (event.pageX + 12) + "px")
          .style("top", (event.pageY + 12) + "px");
      })
      .on("mouseleave", () => tooltip.style("opacity", 0));
  }
}

function addPlayer(){
  const el = document.getElementById("playerInput");
  const id = el.value.trim();
  if (!id) return;
  el.value = "";
  selectedPlayers.add(id);
  renderChips();
  draw();
}

document.getElementById("addBtn").addEventListener("click", addPlayer);
document.getElementById("playerInput").addEventListener("keydown", (e)=>{ if(e.key==="Enter") addPlayer(); });

document.getElementById("applyRosterBtn").addEventListener("click", ()=>{
  rosterMap = parseRoster(document.getElementById("rosterText").value);
  renderChips();
  // tooltip 內容也會跟著變
});

d3.csv("whr_output_wide.csv").then(data => {
  data.forEach(d => {
    d.date = new Date(d.date);
    for (const key in d){
      if (key === "date") continue;
      const v = +d[key];
      // 需求：值為 0 時自動忽略
      d[key] = (v === 0 || Number.isNaN(v)) ? null : v;
    }
  });
  rawData = data;
  renderChips();
  draw();
}).catch(err => {
  alert("讀取 CSV 失敗：請確認 whr_output_wide.csv 與 index.html 在同資料夾。\n\n" + err);
});
</script>
</body>
</html>
