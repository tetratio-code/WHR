<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Othello Elo rating (WHR)</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; margin:20px; }
  h1 { margin: 0 0 12px 0; font-size: 34px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin: 8px 0; }
  #chart { border:1px solid #ddd; border-radius:12px; padding:10px; position:relative; overflow:hidden; }
  #tooltip{
    position:absolute;
    z-index:9999;
    pointer-events:none;
    opacity:0;
    background:white;
    border:1px solid #ccc;
    padding:8px 10px;
    border-radius:10px;
    font-size:12px;
    box-shadow:0 6px 18px rgba(0,0,0,0.08);
    white-space:nowrap;
  }
  input[type="text"], input[type="date"], select{
    padding:6px 10px; border:1px solid #ccc; border-radius:8px; font-size:14px;
  }
  input[type="text"]{ width:180px; }
  button{ padding:7px 12px; border:1px solid #ccc; border-radius:8px; background:#fff; cursor:pointer; }
  button:hover{ background:#f3f3f3; }
  .panel{ border:1px solid #e6e6e6; background:#fafafa; border-radius:12px; padding:12px; }
  .muted{ color:#666; font-size:13px; }
  .chips{ margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    background:#fff; border:1px solid #ddd; border-radius:999px;
    padding:6px 10px; font-size:13px; display:inline-flex; gap:8px; align-items:center;
  }
  .chip button{
    border:none; background:transparent; padding:0; font-size:16px; line-height:1; color:#666;
    cursor:pointer;
  }
  .sectionTitle{ font-size:18px; margin:18px 0 8px; }
  table{ border-collapse:collapse; width:100%; background:#fff; border:1px solid #e6e6e6; border-radius:12px; overflow:hidden; }
  th, td{ padding:8px 10px; border-bottom:1px solid #eee; font-size:14px; text-align:left; }
  th{ background:#fafafa; font-weight:600; }
  tr:last-child td{ border-bottom:none; }
  .pager{ display:flex; gap:8px; align-items:center; justify-content:flex-end; margin-top:10px; }
  .pill{ display:inline-block; padding:2px 8px; border:1px solid #ddd; border-radius:999px; background:#fff; font-size:12px; color:#555; }
</style>
</head>

<body>
<h1>Othello Elo rating (WHR)</h1>

<div class="panel">
  <div class="row">
    <input id="playerInput" placeholder="輸入選手編號" />
    <button id="addBtn" type="button">加入折線</button>
    <button id="clearBtn" type="button">清除全部</button>
    <span class="muted">資料：<code>whr_output.csv</code>（date, player_id, elo；日期缺漏會線性內插成逐日資料）</span>
  </div>

  <div class="muted" style="margin-top:8px">目前顯示（可移除）：</div>
  <div id="playerChips" class="chips"></div>
</div>

<div id="chart" style="margin-top:12px">
  <div id="tooltip"></div>
</div>

<div class="sectionTitle">Elo rating 排行榜</div>
<div class="panel">
  <div class="row">
    <label class="muted">結束時間點</label>
    <input id="rankEnd" type="date" />

    <label class="muted">搜尋</label>
    <input id="rankSearch" type="text" style="width:220px" placeholder="輸入選手ID或名字">

    <label class="muted">Country</label>
    <select id="rankCountry" style="padding:6px 10px; border:1px solid #ccc; border-radius:8px; font-size:14px;">
      <option value="">全部</option>
    </select>

    <span class="muted">總戰力：</span>
    <span id="countryPower" class="pill">0</span>
    <span id="rankMeta" class="pill"></span>
  </div>
  <div id="rankTableWrap"></div>
  <div class="pager">
    <button id="prevPageBtn" type="button">上一頁</button>
    <span id="pageInfo" class="muted"></span>
    <button id="nextPageBtn" type="button">下一頁</button>
  </div>
</div>

<script>
const ROSTER_PATH = "roster.json";
const JOUEURS_PATH = "joueurs.txt";
const CSV_PATH = "whr_output.csv";

let selectedPlayers = new Set();
let rosterMap = new Map();         // chart labels priority
let joueursMap = new Map();        // id -> {name, pays}
let dataByPlayer = new Map();      // pid -> [{date, elo}] sorted
let rawRows = [];                  // parsed CSV rows

// leaderboard state
let rankRows = [];                 // [{globalRank, pid, name, pays, elo, score, dateUsed}]
let currentPage = 1;
const PAGE_SIZE = 100;
let rankWindowStart = null;
let rankWindowEnd = null;

const width = 1200;
const height = 560;
const margin = {top:20,right:20,bottom:40,left:70};

const svg = d3.select("#chart").append("svg")
  .attr("viewBox", `0 0 ${width} ${height}`);

const plot = svg.append("g")
  .attr("transform", `translate(${margin.left},${margin.top})`);

const innerW = width - margin.left - margin.right;
const innerH = height - margin.top - margin.bottom;

const xScale = d3.scaleTime().range([0, innerW]);
const yScale = d3.scaleLinear().range([innerH, 0]);
const color = d3.scaleOrdinal(d3.schemeTableau10);
const tooltip = d3.select("#tooltip");

function getJoueurInfo(pid){
  return joueursMap.get(pid) || null;
}

function getNameForChart(pid){
  const j = getJoueurInfo(pid);
  return rosterMap.get(pid) || (j ? j.name : "") || "";
}

function getNameForLeaderboard(pid){
  const j = getJoueurInfo(pid);
  return j ? j.name : "";
}

function getPaysForLeaderboard(pid){
  const j = getJoueurInfo(pid);
  return j ? j.pays : "";
}

function displayLabel(pid){
  const name = getNameForChart(pid);
  return name ? `${pid} (${name})` : pid;
}

function renderChips(){
  const wrap = document.getElementById("playerChips");
  wrap.innerHTML = "";
  [...selectedPlayers].sort((a,b)=>Number(a)-Number(b)).forEach(pid=>{
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.innerHTML = `<span>${displayLabel(pid)}</span>`;
    const x = document.createElement("button");
    x.textContent = "×";
    x.title = "移除";
    x.onclick = () => {
      selectedPlayers.delete(pid);
      draw();
      renderChips();
    };
    chip.appendChild(x);
    wrap.appendChild(chip);
  });
}

// Linear interpolate to daily points between known dates (inclusive)
function interpolateDaily(points){
  if (!points || points.length === 0) return [];
  const pts = points.slice().sort((a,b)=>a.date-b.date);
  const out = [];
  for (let i=0;i<pts.length-1;i++){
    const a = pts[i], b = pts[i+1];
    const start = d3.timeDay.floor(a.date);
    const end = d3.timeDay.floor(b.date);
    const days = d3.timeDay.count(start, end);
    for (let k=0;k<=days;k++){
      const d = d3.timeDay.offset(start, k);
      const t = (end - start) === 0 ? 0 : (d - start) / (end - start);
      const v = a.elo + t * (b.elo - a.elo);
      const last = out[out.length-1];
      if (!last || +last.date !== +d) out.push({date:d, elo:v});
    }
  }
  const lastKnown = d3.timeDay.floor(pts[pts.length-1].date);
  const lastOut = out[out.length-1];
  if (!lastOut || +lastOut.date !== +lastKnown){
    out.push({date:lastKnown, elo: pts[pts.length-1].elo});
  }
  return out;
}

function draw(){
  plot.selectAll("*").remove();
  const players = [...selectedPlayers];
  if (players.length === 0) return;

  const seriesByPlayer = new Map();
  const all = [];

  for (const p of players){
    const pts = dataByPlayer.get(p) || [];
    if (pts.length < 2) continue;
    const s = interpolateDaily(pts);
    seriesByPlayer.set(p, s);
    for (const d of s) all.push({date:d.date, value:d.elo});
  }
  if (all.length === 0) return;

  xScale.domain(d3.extent(all, d=>d.date));
  yScale.domain(d3.extent(all, d=>d.value)).nice();
  color.domain(players);

  plot.append("g")
    .attr("transform", `translate(0,${innerH})`)
    .call(d3.axisBottom(xScale).ticks(10));

  plot.append("g")
    .call(d3.axisLeft(yScale));

  const line = d3.line()
    .defined(d => d.elo != null && !Number.isNaN(d.elo))
    .x(d => xScale(d.date))
    .y(d => yScale(d.elo));

  const singlePlayerMode = (players.length === 1);
  const globalRankCache = new Map();

  let hoverLine = null;
  let hoverDot = null;
  let hoverOverlay = null;

  if (singlePlayerMode){
    hoverLine = plot.append("line")
      .attr("stroke", "#888")
      .attr("stroke-width", 1)
      .attr("stroke-dasharray", "4,4")
      .attr("y1", 0)
      .attr("y2", innerH)
      .style("display", "none");

    hoverDot = plot.append("circle")
      .attr("r", 4)
      .attr("fill", "#111")
      .attr("stroke", "#fff")
      .attr("stroke-width", 1.5)
      .style("display", "none");

    hoverOverlay = plot.append("rect")
      .attr("x", 0)
      .attr("y", 0)
      .attr("width", innerW)
      .attr("height", innerH)
      .attr("fill", "transparent")
      .style("pointer-events", "all");
  }

  function addYears(date, years){
    const d = new Date(date);
    d.setFullYear(d.getFullYear() + years);
    return d;
  }

  function eloAtDateFromSeriesWith3Y(series, date){
    if (!series || series.length === 0) return null;

    const first = series[0].date;
    const last  = series[series.length - 1].date;
    const lastPlus3Y = addYears(last, 3);

    if (date < first) return null;

    if (date >= last){
      if (date <= lastPlus3Y){
        return series[series.length - 1].elo;
      }
      return null;
    }

    const bisect = d3.bisector(d=>d.date).left;
    const idx = bisect(series, date);

    if (series[idx] && +series[idx].date === +date) return series[idx].elo;
    if (series[idx-1] && +series[idx-1].date === +date) return series[idx-1].elo;
    return null;
  }

function getGlobalRanksForDate(date){
  const key = d3.timeFormat("%Y-%m-%d")(date);
  const cached = globalRankCache.get(key);
  if (cached) return cached;

  const vals = [];
  for (const [pid, pts] of dataByPlayer.entries()){
    if (!pts || pts.length === 0) continue;

    const res = getEloAt(pts, date);
    if (!res || res.elo == null || Number.isNaN(res.elo)) continue;

    const last = pts[pts.length - 1].date;
    const lastPlus3Y = addYears(last, 3);
    if (date > lastPlus3Y) continue;

    vals.push({
      pid,
      pays: getPaysForLeaderboard(pid) || "(NONE)",
      elo: res.elo,
      basePower: Math.pow(2, (res.elo - 1040) / 120) / 10.83
    });
  }

  vals.sort((a,b)=>b.elo - a.elo);

  // 名次
  const rankMap = new Map();
  let prevElo = null;
  let prevRank = 0;
  for (let i=0;i<vals.length;i++){
    const v = vals[i];
    let rank;
    if (prevElo !== null && v.elo === prevElo){
      rank = prevRank;
    } else {
      rank = i + 1;
    }
    rankMap.set(v.pid, rank);
    prevElo = v.elo;
    prevRank = rank;
  }

  // 與排行榜一致：用「全部」各國前5名原始戰力總和」當分母
  const rowsByPays = new Map();
  for (const v of vals){
    if (!rowsByPays.has(v.pays)) rowsByPays.set(v.pays, []);
    rowsByPays.get(v.pays).push(v);
  }

  let allCountryTop5BasePower = 0;
  for (const arr of rowsByPays.values()){
    const top5 = arr.slice(0, 5);
    allCountryTop5BasePower += top5.reduce((sum, r) => sum + r.basePower, 0);
  }

  const basePowerMap = new Map(vals.map(v => [v.pid, v.basePower]));

  const result = {
    rankMap,
    basePowerMap,
    denominator: allCountryTop5BasePower,
    total: vals.length
  };
  globalRankCache.set(key, result);
  return result;
}

  function resetSeriesOpacity(){
    plot.selectAll(".player-line").attr("opacity", 1);
  }
  
  function dimOtherSeries(activePid){
    plot.selectAll(".player-line")
      .attr("opacity", d => d === activePid ? 1 : 0.28);
  }

  for (const p of players){
    const series = seriesByPlayer.get(p);
    if (!series) continue;

    plot.append("path")
      .datum(p)
      .attr("class", "player-line")
      .attr("data-pid", p)
      .attr("fill", "none")
      .attr("stroke", color(p))
      .attr("stroke-width", 1.8)
      .attr("opacity", 1)
      .attr("d", () => line(series));

    if (!singlePlayerMode){
      plot.append("path")
        .datum(series)
        .attr("fill","none")
        .attr("stroke","transparent")
        .attr("stroke-width", 10)
        .attr("d", line)
        .style("cursor","crosshair")
        .style("pointer-events","stroke")
        .on("mouseenter", () => {
          dimOtherSeries(p);
        })
        .on("mousemove", (event) => {
          dimOtherSeries(p);

          const [mx] = d3.pointer(event, plot.node());
          const date = d3.timeDay.floor(xScale.invert(mx));

          const eloHere = eloAtDateFromSeriesWith3Y(series, date);
          if (eloHere == null) {
            tooltip.style("opacity", 0);
            return;
          }

          const name = getNameForChart(p);
          tooltip.style("opacity", 1)
            .html(`
              <div><b>選手</b>：${name ? `${p} (${name})` : p}</div>
              <div><b>日期</b>：${d3.timeFormat("%Y-%m-%d")(date)}</div>
              <div><b>Elo</b>：${eloHere.toFixed(3)}</div>
            `);

          const chartRect = document.getElementById("chart").getBoundingClientRect();
          const tipNode = tooltip.node();
          const tipW = tipNode.offsetWidth;
          const tipH = tipNode.offsetHeight;

          let x = event.clientX - chartRect.left + 12;
          let y = event.clientY - chartRect.top  + 12;

          x = Math.min(x, chartRect.width  - tipW - 8);
          y = Math.min(y, chartRect.height - tipH - 8);

          tooltip.style("left", x + "px").style("top", y + "px");
        })
        .on("mouseleave", () => {
          tooltip.style("opacity", 0);
          resetSeriesOpacity();
        });
    }
  }

  if (singlePlayerMode){
    const p = players[0];
    const series = seriesByPlayer.get(p);

    hoverOverlay
      .style("cursor", "crosshair")
      .on("mousemove", (event) => {
        const [mx] = d3.pointer(event, plot.node());
        const date = d3.timeDay.floor(xScale.invert(mx));

        const eloHere = eloAtDateFromSeriesWith3Y(series, date);
        if (eloHere == null){
          tooltip.style("opacity", 0);
          hoverLine.style("display", "none");
          hoverDot.style("display", "none");
          return;
        }

        const { rankMap, basePowerMap, denominator, total } = getGlobalRanksForDate(date);
        const rank = rankMap.get(p);
        const basePower = basePowerMap.get(p) || 0;
        const relativePower = denominator > 0 ? basePower * 8192 / denominator : 0;
        const name = getNameForChart(p);
        
        const px = xScale(date);
        const py = yScale(eloHere);
        
        hoverLine
          .style("display", null)
          .attr("x1", px)
          .attr("x2", px);
        
        hoverDot
          .style("display", null)
          .attr("cx", px)
          .attr("cy", py);
        
        tooltip.style("opacity", 1)
          .html(`
            <div><b>選手</b>：${name ? `${p} (${name})` : p}</div>
            <div><b>日期</b>：${d3.timeFormat("%Y-%m-%d")(date)}</div>
            <div><b>Elo</b>：${eloHere.toFixed(3)}</div>
            <div><b>名次</b>：${rank ? `${rank}/${total}` : `—/${total}`}</div>
            <div><b>相對戰力</b>：${relativePower.toFixed(2)}</div>
          `);

        const chartRect = document.getElementById("chart").getBoundingClientRect();
        const tipNode = tooltip.node();
        const tipW = tipNode.offsetWidth;
        const tipH = tipNode.offsetHeight;

        let x = event.clientX - chartRect.left + 12;
        let y = event.clientY - chartRect.top  + 12;

        x = Math.min(x, chartRect.width  - tipW - 8);
        y = Math.min(y, chartRect.height - tipH - 8);

        tooltip.style("left", x + "px").style("top", y + "px");
      })
      .on("mouseleave", () => {
        tooltip.style("opacity", 0);
        hoverLine.style("display", "none");
        hoverDot.style("display", "none");
      });
  }
}

function addPlayer(){
  const el = document.getElementById("playerInput");
  const id = el.value.trim();
  if (!id) return;
  el.value = "";
  if (!dataByPlayer.has(id)){
    alert(`找不到選手 ${id} 的資料`);
    return;
  }
  selectedPlayers.add(id);
  renderChips();
  draw();
}

document.getElementById("addBtn").addEventListener("click", addPlayer);
document.getElementById("playerInput").addEventListener("keydown", (e)=>{ if(e.key==="Enter") addPlayer(); });
document.getElementById("clearBtn").addEventListener("click", ()=>{
  selectedPlayers.clear();
  renderChips();
  draw();
});

function parseJoueurs(text){
  // 依 joueurs.txt 的 pays = XXX 分組解析
  const m = new Map();
  const lines = text.split(/\r?\n/);
  let currentPays = "";

  for (const line of lines){
    if (!line) continue;

    const trimmed = line.trim();

    const paysMatch = trimmed.match(/^pays\s*=\s*([A-Z]{3})$/i);
    if (paysMatch){
      currentPays = paysMatch[1].toUpperCase();
      continue;
    }

    const playerMatch = line.match(/^\s*(\d+)\s+(.*?)(?:\s+%_.*)?\s*$/);
    if (!playerMatch) continue;

    const id = playerMatch[1];
    const name = (playerMatch[2] || "").trim();
    if (!name) continue;

    if (!m.has(id)){
      m.set(id, {
        name,
        pays: currentPays
      });
    }
  }

  return m;
}

function populateCountrySelect(){
  const select = document.getElementById("rankCountry");
  const paysSet = new Set();

  for (const info of joueursMap.values()){
    if (info.pays) paysSet.add(info.pays);
  }

  const paysList = [...paysSet].sort();

  select.innerHTML = `<option value="">全部</option>` +
    paysList.map(p => `<option value="${p}">${p}</option>`).join("");
}

// -------- Leaderboard --------
function setDefaultRankEnd(){
  const today = new Date();
  document.getElementById("rankEnd").value = today.toISOString().slice(0,10);
}

function getEloAt(points, target){
  const n = points.length;
  if (n === 0) return null;

  const first = points[0].date;
  const last = points[n-1].date;

  if (target < first) return null;
  if (target >= last) return { elo: points[n-1].elo, dateUsed: last };

  const bisect = d3.bisector(d=>d.date).right;
  const idx = bisect(points, target) - 1;
  const a = points[idx];
  const b = points[idx+1];

  const t = (b.date - a.date) === 0 ? 0 : (target - a.date) / (b.date - a.date);
  const v = a.elo + t * (b.elo - a.elo);
  return { elo: v, dateUsed: target };
}

function getFilteredRankRows(){
  const q = (document.getElementById("rankSearch")?.value || "").trim().toLowerCase();
  if (!q) return rankRows;

  return rankRows.filter(d => {
    const pid = String(d.pid).toLowerCase();
    const name = String(d.name || "").toLowerCase();
    return pid.includes(q) || name.includes(q);
  });
}

function computeRanking(){
  const endStr = document.getElementById("rankEnd").value;
  const end = endStr ? new Date(endStr + "T00:00:00") : new Date();
  const start = new Date(end);
  start.setFullYear(end.getFullYear() - 3);

  const countryVal = document.getElementById("rankCountry").value.trim().toUpperCase();
  const country = countryVal === "" ? null : countryVal;

  function addYears(date, years){
    const d = new Date(date);
    d.setFullYear(d.getFullYear() + years);
    return d;
  }

  // 先建立「全部」排行榜資料
  const allRows = [];
  for (const [pid, pts] of dataByPlayer.entries()){
    if (!pts || pts.length === 0) continue;

    const res = getEloAt(pts, end);
    if (!res || res.elo == null || Number.isNaN(res.elo)) continue;

    // 與折線圖一致：
    // 1. end 早於第一場 => getEloAt 已經回傳 null，不會進來
    // 2. end 晚於最後一場，只保留 3 年
    const last = pts[pts.length - 1].date;
    const lastPlus3Y = addYears(last, 3);
    if (end > lastPlus3Y) continue;

    const basePower = Math.pow(2, (res.elo - 1040) / 120) / 10.83;

    allRows.push({
      pid,
      name: getNameForLeaderboard(pid),
      pays: getPaysForLeaderboard(pid),
      elo: res.elo,
      basePower,
      dateUsed: res.dateUsed
    });
  }

  // 全域 Elo 排序
  allRows.sort((a,b)=> b.elo - a.elo);

  // 全域排名
  const allRowsWithRank = allRows.map((d, i) => ({
    ...d,
    globalRank: i + 1
  }));

  // 「全部」總戰力：各國前5名原始戰力相加
  const rowsByPays = new Map();
  for (const r of allRowsWithRank){
    const pays = r.pays || "(NONE)";
    if (!rowsByPays.has(pays)) rowsByPays.set(pays, []);
    rowsByPays.get(pays).push(r);
  }

  let allCountryTop5BasePower = 0;
  for (const arr of rowsByPays.values()){
    const top5 = arr.slice(0, 5);
    allCountryTop5BasePower += top5.reduce((sum, r) => sum + r.basePower, 0);
  }

  // Country 篩選
  const rows = allRowsWithRank.filter(r => {
    if (country === null) return true;
    return r.pays === country;
  });

  // 相對戰力：用「全部」各國前5名原始戰力總和當分母
  rankRows = rows.map(d => ({
    ...d,
    score: allCountryTop5BasePower > 0 ? d.basePower * 8192 / allCountryTop5BasePower : 0
  }));

  rankWindowStart = start;
  rankWindowEnd = end;

  // 顯示總戰力：
  // 全部 -> 各國前5名原始戰力總和
  // 個別國家 -> 該國前82名相對戰力總和
  let power = 0;
  if (country === null){
    power = allCountryTop5BasePower;
  } else {
    power = rankRows
      .slice(0, 82)
      .reduce((sum, r) => sum + r.score, 0);
  }

  document.getElementById("countryPower").textContent = power.toFixed(2);

  currentPage = 1;
  renderRanking();
}

function renderRanking(start = rankWindowStart, end = rankWindowEnd){
  const wrap = document.getElementById("rankTableWrap");

  const filtered = getFilteredRankRows();
  const totalAll = rankRows.length;
  const total = filtered.length;

  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  currentPage = Math.min(Math.max(1, currentPage), pages);

  const startIdx = (currentPage - 1) * PAGE_SIZE;
  const slice = filtered.slice(startIdx, startIdx + PAGE_SIZE);

  const fmtDate = d3.timeFormat("%Y-%m-%d");
  const rowsHtml = slice.map(d => {
    const name = d.name ? d.name : "(未命名)";
    return `<tr>
      <td>${d.globalRank}</td>
      <td>${d.pid}</td>
      <td>${name}</td>
      <td>${d.pays || ""}</td>
      <td>${d.elo.toFixed(3)}</td>
      <td>${d.score.toFixed(2)}</td>
      <td>${fmtDate(d.dateUsed)}</td>
    </tr>`;
  }).join("");

  wrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th style="width:70px">排名</th>
          <th style="width:110px">ID</th>
          <th>選手</th>
          <th style="width:80px">pays</th>
          <th style="width:120px">Elo</th>
          <th style="width:120px">相對戰力</th>
          <th style="width:120px">取值日期</th>
        </tr>
      </thead>
      <tbody>
        ${rowsHtml || `<tr><td colspan="7" class="muted">無資料</td></tr>`}
      </tbody>
    </table>
  `;

  document.getElementById("pageInfo").textContent =
    `第 ${currentPage} / ${pages} 頁（本頁依搜尋顯示，共 ${total} 筆；全域 ${totalAll} 筆，每頁 ${PAGE_SIZE} 筆）`;

  document.getElementById("rankMeta").textContent =
    `${start && end ? `${fmtDate(start)} ~ ${fmtDate(end)} | ` : ""}shown: ${total} / all: ${totalAll}`;

  document.getElementById("prevPageBtn").disabled = (currentPage <= 1);
  document.getElementById("nextPageBtn").disabled = (currentPage >= pages);
}

document.getElementById("rankEnd").addEventListener("change", computeRanking);
document.getElementById("rankSearch").addEventListener("input", ()=>{
  currentPage = 1;
  renderRanking();
});
document.getElementById("rankCountry").addEventListener("change", computeRanking);
document.getElementById("prevPageBtn").addEventListener("click", ()=>{
  currentPage--;
  renderRanking();
});
document.getElementById("nextPageBtn").addEventListener("click", ()=>{
  currentPage++;
  renderRanking();
});

// ---------- Load everything ----------
setDefaultRankEnd();

Promise.all([
  d3.json(ROSTER_PATH).catch(()=>({})),
  d3.text(JOUEURS_PATH).catch(()=>""),
  d3.csv(CSV_PATH)
]).then(([roster, joueursText, rows]) => {
  rosterMap = new Map(Object.entries(roster));
  joueursMap = parseJoueurs(joueursText);
  populateCountrySelect();

  rows.forEach(r => {
    r.date = new Date(r.date);
    r.player_id = String(r.player_id);
    r.elo = +r.elo;
    if (r.elo === 0 || Number.isNaN(r.elo)) r.elo = null;
  });
  rawRows = rows;

  const byP = d3.group(rows.filter(r=>r.elo!=null), d=>d.player_id);
  for (const [pid, arr] of byP.entries()){
    arr.sort((a,b)=>a.date-b.date);
    dataByPlayer.set(pid, arr.map(d=>({date:d.date, elo:d.elo})));
  }

  const bestByDate = new Map();
  const fmt = d3.timeFormat("%Y-%m-%d");

  for (const [pid, pts] of dataByPlayer.entries()){
    if (!pts || pts.length < 2) continue;
    const daily = interpolateDaily(pts);
    for (const d of daily){
      if (d.elo == null || Number.isNaN(d.elo)) continue;
      const k = fmt(d.date);
      const cur = bestByDate.get(k);
      if (!cur || d.elo > cur.elo){
        bestByDate.set(k, {pid, elo: d.elo});
      }
    }
  }

  selectedPlayers = new Set([...bestByDate.values()].map(d => d.pid));
  selectedPlayers.add("13841");

  renderChips();
  draw();
  computeRanking();
}).catch(err => {
  alert("讀取失敗：請確認以下檔案與 index.html 在同資料夾：\n- whr_output.csv\n- roster.json（可選）\n- joueurs.txt（必要）\n\n" + err);
});
</script>
</body>
</html>
