<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Elo rating 折線圖</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

<style>
body { font-family: system-ui; margin:20px; }
#chart { border:1px solid #ddd; border-radius:10px; padding:10px; }
#tooltip {
  position:absolute;
  background:white;
  border:1px solid #ccc;
  padding:8px;
  border-radius:8px;
  font-size:12px;
  pointer-events:none;
  opacity:0;
}
</style>
</head>

<body>

<h2>Elo rating 折線圖</h2>

<input id="playerInput" placeholder="輸入選手編號">
<button onclick="addPlayer()">加入折線</button>

<div id="chart"></div>
<div id="tooltip"></div>

<script>
const defaultPlayers = [
"178","299","300","488","578","603","698","700",
"3024","4011","4014","4043","4097","5537",
"5568","5577","10027","10104","10851",
"11348","13168"
];

let selectedPlayers = new Set(defaultPlayers);
let rawData;
let svg, xScale, yScale, color;

const width = 1000;
const height = 500;
const margin = {top:20,right:20,bottom:40,left:60};

svg = d3.select("#chart")
  .append("svg")
  .attr("viewBox", `0 0 ${width} ${height}`);

const plot = svg.append("g")
  .attr("transform", `translate(${margin.left},${margin.top})`);

xScale = d3.scaleTime().range([0, width-margin.left-margin.right]);
yScale = d3.scaleLinear().range([height-margin.top-margin.bottom, 0]);
color = d3.scaleOrdinal(d3.schemeTableau10);

const tooltip = d3.select("#tooltip");

d3.csv("whr_output_wide.csv").then(data => {

  data.forEach(d => {
    d.date = new Date(d.date);
    for (let key in d) {
      if (key !== "date") d[key] = +d[key];
    }
  });

  rawData = data;
  draw();

});

function draw() {

  plot.selectAll("*").remove();

  const players = Array.from(selectedPlayers);
  const allPoints = [];

  players.forEach(p => {
    rawData.forEach(d => {
      if (d[p] != null && !isNaN(d[p])) {
        allPoints.push({date:d.date,value:d[p]});
      }
    });
  });

  xScale.domain(d3.extent(allPoints, d => d.date));
  yScale.domain(d3.extent(allPoints, d => d.value)).nice();

  plot.append("g")
    .attr("transform", `translate(0,${height-margin.top-margin.bottom})`)
    .call(d3.axisBottom(xScale));

  plot.append("g")
    .call(d3.axisLeft(yScale));

  const line = d3.line()
    .x(d => xScale(d.date))
    .y(d => yScale(d.value));

  players.forEach(p => {

    const series = rawData
      .filter(d => d[p] != null && !isNaN(d[p]))
      .map(d => ({date:d.date,value:d[p]}));

    plot.append("path")
      .datum(series)
      .attr("fill","none")
      .attr("stroke",color(p))
      .attr("stroke-width",1.8)
      .attr("d",line)
      .on("mousemove", (event) => {
        const [mx] = d3.pointer(event);
        const date = xScale.invert(mx);

        const bisect = d3.bisector(d=>d.date).left;
        const i = bisect(series,date,1);
        const d0 = series[i-1];
        const d1 = series[i];
        const d = (!d1 || date-d0.date < d1.date-date) ? d0 : d1;

        tooltip.style("opacity",1)
          .html(`
            選手: ${p}<br>
            日期: ${d3.timeFormat("%Y-%m-%d")(d.date)}<br>
            Elo: ${d.value.toFixed(3)}
          `)
          .style("left",event.pageX+10+"px")
          .style("top",event.pageY+10+"px");
      })
      .on("mouseleave", () => tooltip.style("opacity",0));

  });

}

function addPlayer(){
  const val = document.getElementById("playerInput").value.trim();
  if (!val) return;
  selectedPlayers.add(val);
  draw();
}

</script>
</body>
</html>
