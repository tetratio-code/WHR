<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Elo rating 折線圖</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; margin:20px; }
  h1 { margin: 0 0 12px 0; font-size: 34px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin: 8px 0; }
  #chart { border:1px solid #ddd; border-radius:12px; padding:10px; position:relative; overflow:hidden; }
  #tooltip{
    position:absolute;
    z-index:9999;
    pointer-events:none;
    opacity:0;
    background:white;
    border:1px solid #ccc;
    padding:8px 10px;
    border-radius:10px;
    font-size:12px;
    box-shadow:0 6px 18px rgba(0,0,0,0.08);
    white-space:nowrap;
  }
  input[type="text"]{ padding:6px 10px; border:1px solid #ccc; border-radius:8px; font-size:14px; width:180px; }
  button{ padding:7px 12px; border:1px solid #ccc; border-radius:8px; background:#fff; cursor:pointer; }
  button:hover{ background:#f3f3f3; }
  .panel{ border:1px solid #e6e6e6; background:#fafafa; border-radius:12px; padding:12px; }
  .muted{ color:#666; font-size:13px; }
  .chips{ margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    background:#fff; border:1px solid #ddd; border-radius:999px;
    padding:6px 10px; font-size:13px; display:inline-flex; gap:8px; align-items:center;
  }
  .chip button{
    border:none; background:transparent; padding:0; font-size:16px; line-height:1; color:#666;
    cursor:pointer;
  }
  textarea{
    width:min(900px, 100%); height:140px; padding:10px;
    border:1px solid #ddd; border-radius:10px; font-size:13px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    background:#fff;
  }
</style>
</head>

<body>
<h1>Elo rating 折線圖</h1>

<div class="panel">
  <div class="row">
    <input id="playerInput" placeholder="輸入選手編號" />
    <button id="addBtn" type="button">加入折線</button>
    <span class="muted">CSV：<code>whr_output.csv</code>（date, player_id, elo；日期缺漏會線性內插成逐日資料）</span>
  </div>

  <div class="muted" style="margin-top:8px">目前顯示（可移除）：</div>
  <div id="playerChips" class="chips"></div>

  <hr style="border:none;border-top:1px solid #e6e6e6;margin:12px 0;">

  <div class="row" style="justify-content:space-between">
    <div>
      <div><b>名錄（可編輯）</b> <span class="muted">每行：選手編號 + TAB/空白 + 名稱</span></div>
      <div class="muted">例：<code>11348&lt;tab&gt;手塚</code></div>
    </div>
    <button id="applyRosterBtn" type="button">套用名錄</button>
  </div>

  <textarea id="rosterText" spellcheck="false" placeholder="把你的 名錄.txt 貼在這裡（例如：&#10;11348	手塚&#10;603	金田&#10;...）"></textarea>

  <div class="muted" style="margin-top:10px">
    Hover 到折線：顯示選手編號（含名錄名稱）、該時間點 Elo。<br/>
    預設顯示：各時間點 Elo 最高的選手們（由 CSV 自動計算）。
  </div>
</div>

<div id="chart" style="margin-top:12px">
  <div id="tooltip"></div>
</div>

<script>
const CSV_PATH = "whr_output.csv"; // put next to this HTML on GitHub Pages

let selectedPlayers = new Set();   // will be filled after loading (default = ever-top players)
let rosterMap = new Map();         // id -> name
let dataByPlayer = new Map();      // id -> [{date:Date, elo:number}] sorted
let rawRows = null;

const width = 1200;
const height = 560;
const margin = {top:20,right:20,bottom:40,left:70};

const svg = d3.select("#chart").append("svg")
  .attr("viewBox", `0 0 ${width} ${height}`);

const plot = svg.append("g")
  .attr("transform", `translate(${margin.left},${margin.top})`);

const innerW = width - margin.left - margin.right;
const innerH = height - margin.top - margin.bottom;

const xScale = d3.scaleTime().range([0, innerW]);
const yScale = d3.scaleLinear().range([innerH, 0]);
const color = d3.scaleOrdinal(d3.schemeTableau10);
const tooltip = d3.select("#tooltip");

function parseRoster(text){
  const m = new Map();
  const lines = text.split(/\r?\n/);
  for (const line of lines){
    const s = line.trim();
    if (!s) continue;
    const parts = s.split(/\s+/);
    if (parts.length < 2) continue;
    const id = parts[0];
    const name = parts.slice(1).join(" ");
    m.set(id, name);
  }
  return m;
}
function displayLabel(id){
  const name = rosterMap.get(id);
  return name ? `${id} (${name})` : id;
}

function renderChips(){
  const wrap = document.getElementById("playerChips");
  wrap.innerHTML = "";
  [...selectedPlayers].sort((a,b)=>Number(a)-Number(b)).forEach(id=>{
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.innerHTML = `<span>${displayLabel(id)}</span>`;
    const x = document.createElement("button");
    x.textContent = "×";
    x.title = "移除";
    x.onclick = () => {
      selectedPlayers.delete(id);
      draw();
      renderChips();
    };
    chip.appendChild(x);
    wrap.appendChild(chip);
  });
}

// Linear interpolate to daily points between known dates (inclusive)
function interpolateDaily(points){
  if (!points || points.length === 0) return [];
  const pts = points.slice().sort((a,b)=>a.date-b.date);
  const out = [];
  for (let i=0;i<pts.length-1;i++){
    const a = pts[i], b = pts[i+1];
    const start = d3.timeDay.floor(a.date);
    const end = d3.timeDay.floor(b.date);
    const days = d3.timeDay.count(start, end);
    // include start day (but avoid duplicate if previous segment already added it)
    for (let k=0;k<=days;k++){
      const d = d3.timeDay.offset(start, k);
      const t = (end - start) === 0 ? 0 : (d - start) / (end - start);
      const v = a.elo + t * (b.elo - a.elo);
      const last = out[out.length-1];
      if (!last || +last.date !== +d) out.push({date:d, elo:v});
    }
  }
  // ensure last known day exists
  const lastKnown = d3.timeDay.floor(pts[pts.length-1].date);
  const lastOut = out[out.length-1];
  if (!lastOut || +lastOut.date !== +lastKnown){
    out.push({date:lastKnown, elo: pts[pts.length-1].elo});
  }
  return out;
}

function draw(){
  plot.selectAll("*").remove();
  const players = [...selectedPlayers];
  if (players.length === 0) return;

  // Build interpolated series only for selected players
  const seriesByPlayer = new Map();
  const all = [];
  for (const p of players){
    const pts = dataByPlayer.get(p) || [];
    if (pts.length < 2) continue;
    const s = interpolateDaily(pts);
    seriesByPlayer.set(p, s);
    for (const d of s) all.push({date:d.date, value:d.elo});
  }
  if (all.length === 0) return;

  xScale.domain(d3.extent(all, d=>d.date));
  yScale.domain(d3.extent(all, d=>d.value)).nice();
  color.domain(players);

  plot.append("g")
    .attr("transform", `translate(0,${innerH})`)
    .call(d3.axisBottom(xScale).ticks(10));

  plot.append("g")
    .call(d3.axisLeft(yScale));

  const line = d3.line()
    .defined(d => d.elo != null && !Number.isNaN(d.elo))
    .x(d => xScale(d.date))
    .y(d => yScale(d.elo));

  for (const p of players){
    const series = seriesByPlayer.get(p);
    if (!series) continue;

    plot.append("path")
      .datum(series)
      .attr("fill","none")
      .attr("stroke", color(p))
      .attr("stroke-width", 1.8)
      .attr("d", line);

    // hover hit path
    plot.append("path")
      .datum(series)
      .attr("fill","none")
      .attr("stroke","transparent")
      .attr("stroke-width", 10)
      .attr("d", line)
      .style("cursor","crosshair")
      .style("pointer-events","stroke")
      .on("mousemove", (event) => {
        // Find point at this day (daily series => exact by rounding)
        const [mx] = d3.pointer(event, plot.node());
        const date = d3.timeDay.floor(xScale.invert(mx));

        // binary search for exact date in daily series
        const bisect = d3.bisector(d=>d.date).left;
        const idx = bisect(series, date);
        const pt = series[idx] && (+series[idx].date === +date) ? series[idx] : (series[idx-1] && (+series[idx-1].date === +date) ? series[idx-1] : null);
        if (!pt) { tooltip.style("opacity", 0); return; }

        const name = rosterMap.get(p);
        tooltip.style("opacity", 1)
          .html(`
            <div><b>選手</b>：${name ? `${p} (${name})` : p}</div>
            <div><b>日期</b>：${d3.timeFormat("%Y-%m-%d")(pt.date)}</div>
            <div><b>Elo</b>：${pt.elo.toFixed(3)}</div>
          `);

        const chartRect = document.getElementById("chart").getBoundingClientRect();
        const tipNode = tooltip.node();
        const tipW = tipNode.offsetWidth;
        const tipH = tipNode.offsetHeight;

        let x = event.clientX - chartRect.left + 12;
        let y = event.clientY - chartRect.top  + 12;

        x = Math.min(x, chartRect.width  - tipW - 8);
        y = Math.min(y, chartRect.height - tipH - 8);

        tooltip.style("left", x + "px").style("top", y + "px");
      })
      .on("mouseleave", () => tooltip.style("opacity", 0));
  }
}

function addPlayer(){
  const el = document.getElementById("playerInput");
  const id = el.value.trim();
  if (!id) return;
  el.value = "";
  if (!dataByPlayer.has(id)){
    alert(`找不到選手 ${id} 的資料`);
    return;
  }
  selectedPlayers.add(id);
  renderChips();
  draw();
}

document.getElementById("addBtn").addEventListener("click", addPlayer);
document.getElementById("playerInput").addEventListener("keydown", (e)=>{ if(e.key==="Enter") addPlayer(); });

document.getElementById("applyRosterBtn").addEventListener("click", ()=>{
  rosterMap = parseRoster(document.getElementById("rosterText").value);
  renderChips();
});

// Load CSV (long format: date, player_id, elo)
d3.csv(CSV_PATH).then(rows => {
  // parse
  rows.forEach(r => {
    r.date = new Date(r.date);
    r.player_id = String(r.player_id);
    r.elo = +r.elo;
    if (r.elo === 0 || Number.isNaN(r.elo)) r.elo = null;
  });

  // group by player
  const byP = d3.group(rows.filter(r=>r.elo!=null), d=>d.player_id);
  for (const [pid, arr] of byP.entries()){
    arr.sort((a,b)=>a.date-b.date);
    dataByPlayer.set(pid, arr.map(d=>({date:d.date, elo:d.elo})));
  }
  rawRows = rows;

  // default players = ever top by date
  const bestByDate = new Map(); // YYYY-MM-DD -> {pid, elo}
  const fmt = d3.timeFormat("%Y-%m-%d");
  for (const r of rows){
    if (r.elo == null) continue;
    const k = fmt(r.date);
    const cur = bestByDate.get(k);
    if (!cur || r.elo > cur.elo){
      bestByDate.set(k, {pid: r.player_id, elo: r.elo});
    }
  }
  selectedPlayers = new Set([...bestByDate.values()].map(d=>d.pid));
  renderChips();
  draw();
}).catch(err => {
  alert("讀取 CSV 失敗：請確認 whr_output.csv 與 index.html 在同資料夾。\n\n" + err);
});
</script>
</body>
</html>
